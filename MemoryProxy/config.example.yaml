# ═══════════════════════════════════════════════════════════════════════════════
# Context Proxy — Complete Configuration Reference
# ═══════════════════════════════════════════════════════════════════════════════
#
# Every field has a default value; unset fields fall back automatically. The
# meaning and usage of each config item is listed below.
#
# Request processing flow:
#   client request → auth (authentication) → sessionInit (session init: popup to
#   select team/agent/task) → injection (context injection: skill/memory/wiki/
#   knowledge into system prompt) → forward to upstream LLM → usage/reporting →
#   return to client
#
# Inter-module dependencies:
#   sessionInit depends on coreSkill (kernel 8420 fetches team/agent/task list) + state storage
#   injection  depends on coreSkill (skill RAG injection) + tdai (memory L1/L2/L3)
#   auth       independent, calls kernel POST /v3/meta/auth/verify to verify apiKey → user_id
#
# State storage backend:
#   Injection/Skill related data (inj:*/sk:*/vpin:*) defaults to Redis; after
#   enabling storage.enabled=true it can switch to ProxyStorage
#   (COS/SQLite/FS/Memory). See the storage: section.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Server listening ─────────────────────────────────────────────────────────
server:
  host: 0.0.0.0 # Listen address; 0.0.0.0 means all interfaces
  port: 8096 # Listen port
  forwardTimeoutMs: 600000 # Upstream forward timeout (ms), default 600000 (10 min); 0 = no timeout

# ── Upstream LLM service (default fallback) ──────────────────────────────────
upstream:
  # Upstream OpenAI-compatible API address (/v1/chat/completions is auto-appended by proxy)
  # Full paths are also supported, e.g. https://llm-upstream.example.com/v2/
  url: https://tokenhub.example.com/v1
  # If non-empty, replaces the Authorization: Bearer <apiKey> in all forwarded requests.
  # Leave empty to pass through the client's original API Key.
  apiKey: "<YOUR_TOKENHUB_API_KEY>"

  # ── Per-Agent override ─────────────────────────────────────────────────────
  # Override url + apiKey by agent name (URL path prefix /{agent}/...).
  # Anthropic and OpenAI protocols share the same table.
  #
  # Fallback rules (important) — only when "this agent is not configured" does
  # the outer upstream fallback apply:
  #
  #   ┌────────────────────────────────┬────────────┬───────────────────────┐
  #   │ This agent's config           │ url used   │ apiKey used           │
  #   ├────────────────────────────────┼────────────┼───────────────────────┤
  #   │ Not in agents                 │ upstream.url│ upstream.apiKey (fallback)│
  #   │ In agents, url only           │ agent.url  │ pass through client key │
  #   │ In agents, url + apiKey       │ agent.url  │ agent.apiKey          │
  #   └────────────────────────────────┴────────────┴───────────────────────┘
  #
  # The middle row is an intentional design gap: once an agent appears in this
  # table, the outer upstream.apiKey fallback is cut off, allowing operators to
  # let some agents use a server-side key and others pass through the client's
  # own key within the same proxy.
  #
  # Full priority (high → low):
  #   1. costGuard internal routing credentials (cheap-model fallback)
  #   2. upstream.agents[agent].url + upstream.agents[agent].apiKey
  #   3. costGuard.anthropicUpstream.url (Anthropic protocol only)
  #   4. upstream.url + upstream.apiKey (default when agent not matched)
  agents: {}
    # claude-code:                                        # server-side key mode
    #   url: "https://claude-upstream.example.com/v1"
    #   apiKey: "sk-ant-agent-key"
    # codex:                                              # client key pass-through mode
    #   url: "https://codex-upstream.example.com/v1"
    #   # omit apiKey → pass through the client's own key, skip outer fallback
    # Note: workbuddy / codebuddy / claude-code clients do not need per-agent overrides;
    # their requests naturally fall to the outer upstream.url + user_key used for auth,
    # and the proxy automatically fetches the corresponding team/agent/task context
    # from the kernel by user_id (no manual resource creation needed).
    # User assets (Team / Agent / Task / user authorization) should be created in the
    # MemoryPanel Web panel.

# ──── Multi-client onboarding (workbuddy / codebuddy / claude-code, etc.) ─────
# MemoryProxy does not manage user assets. Team / Agent / Task / user authorization
# are all created in the MemoryPanel Web panel (port 8123). Client onboarding flow:
#
#   1. Admin in MemoryPanel:
#      - Create a User, get a user_key in sk-mem-xxx format
#      - Create a Team, add the user as a member
#      - Create Agent and Task under the Team
#   2. Client config (baseUrl only needs to reach {agent}/{spaceId}; the client SDK
#      auto-appends the API path):
#      - Base URL: http://<proxy-host>:8096/{agent}/{spaceId}
#        e.g. http://proxy.example.com:8096/workbuddy/mem-demo
#             http://proxy.example.com:8080/codebuddy/default
#      - API Key:  the user_key from step 1 (sk-mem-* format)
#      - Model:    a model name supported by the upstream
#   3. Client sends first message → proxy intercepts → verifyUserKey → listTeams →
#      listAgents → listTasks → interactive form to select team/agent/task →
#      register session → auto-inject L2(agent) + L3(team) memory into system
#      prompt each turn → forward to upstream LLM.
#
# Natural multi-user isolation: listTeams(userId) only returns teams the user
# belongs to, listAgents is filtered a second time by user; different session_ids
# have independent session state machines.
#
# To skip the form for integration testing: enable debugForceIdentity /
# debugForceUserId below (local/E2E only). When disabled, the full form
# interaction is the standard production path for multi-user scenarios.

# ── Logging ─────────────────────────────────────────────────────────────────
log:
  file:
    logs # Log directory; auto-generates usage JSONL + proxy.log structured logs by date
    #   leave "" to skip file output, console only
  verbose: false # true = extra debug info to stderr
  level: info # info | debug — debug additionally outputs routing/analysis details
  backend: console # noop | console — structured logs to stderr (console) or disabled (noop)
  rotate:
    maxSizeBytes: 104857600 # max bytes per proxy.log file before rotation (default 100MB)
    backupLimit: 10 # max number of rotated backups to keep

# ── Redis (historical backend for injection / Skill layer) ───────────────────
# Injection layer / Skill layer data (inj:*, sk:*, skill:vpin:*) defaults to
# Redis (historical behavior). After enabling storage.enabled=true below, this
# data switches to ProxyStorage (COS/SQLite/FS/Memory). See the storage: section.
redis:
  enabled: true # whether Redis is enabled; whether injection/Skill data uses Redis is decided by storage.enabled.
  # url: "redis://:password@host:port/db"   # full Redis URL; overrides host/port/password/db below when set
  host: "127.0.0.1" # Redis host
  port: 6379 # Redis port
  password: "" # Redis password
  db: 0 # Redis database number
  ttlSeconds: 1800 # injection & Skill cache TTL (seconds), default 1800 (30 min)
  # injectionTtlSeconds: 3600  # injection layer hook cache TTL (seconds), defaults to ttlSeconds

# ── Memory instance × actual model Input TPM / QPM rate limiting ─────────────
# Applies to all main-model calls whose URL contains a spaceId.
# Multiple pods count atomically via the shared Redis above. When Redis is
# unavailable it fails open and logs a warning.
# Instance/model overrides are managed via /v3/admin/rate-limits and take effect
# on the next request.
rateLimit:
  tpm: 1000000 # actual Input Tokens / last 60 seconds
  qpm: 100 # request count / last 60 seconds; same dimension as TPM

# ── Storage (unified storage abstraction for injection + Skill layer, replacing
#    Redis for inj:*/sk:*/vpin:*) ──────────────────────────────────────────────
# See docs/design/2026-07-09-redis-to-cos-migration-plan.md
#
# [Master switch] storage.enabled=false (default) → fully use the original Redis
#           path; migration code is not loaded, behavior is **exactly the same**
#           as before this migration.
# [Switch semantics] storage.enabled=true → replace the inj:*/sk:*/vpin:*
#           related Redis repos with ProxyStorage.
#
# [Production recommendations]
#   - Single-instance local/internal: backend=sqlite (default; uses ~/.tdai-memory-proxy/proxy.db)
#   - Production multi-instance:     backend=cos (multi-node shared + cheap object storage)
#   - Offline/private deployment:    backend=fs
#   - Fallback / testing:            backend=memory
#
# [Degradation chain] cos → sqlite → fs → memory; any backend init failure
#          auto-degrades, /health exposes storage.effective (production observability anchor)
#
# [Rollback] change to enabled=false at any stage to return to the Redis path without restart.
#
# ═══════════════════════════════════════════════════════════════════════════
# Field quick reference ([req] = required / [opt] = optional with default /
# [dead] = not read under current backend, safe to delete)
#
#   ┌─────────────────────────────┬────────┬───────────────────────────────────┐
#   │ field                       │ cos    │ sqlite / fs / memory              │
#   ├─────────────────────────────┼────────┼───────────────────────────────────┤
#   │ enabled                     │ [req]  │ [req]                              │
#   │ backend                     │ [req]  │ [req]                              │
#   │ ttlDays                     │ [dead]*│ sqlite=[opt default 7] fs/memory=[dead]│
#   │ cos.rootPrefix              │ [dead]**│ [dead]                            │
#   │ cos.endpointDomain          │ [opt]  │ [dead]                             │
#   │ cos.shark.baseUrl           │ [req]  │ [dead]                             │
#   │ cos.shark.*  (others)       │ [opt]  │ [dead]                             │
#   │ sqlite.dbPath               │ [dead] │ sqlite=[opt default empty] others=[dead]│
#   │ fs.fsRoot                   │ [dead] │ fs=[req] others=[dead]             │
#   └─────────────────────────────┴────────┴───────────────────────────────────┘
#
#   * cos bucket expiry relies on COS lifecycle rule, not ttlDays
#   ** shark side hardcodes "proxy_cache"; any value on the proxy side is ignored
# ═══════════════════════════════════════════════════════════════════════════
storage:
  # [req] master switch: false = fully use the legacy Redis path (default)
  enabled: false

  # [req] preferred backend: cos | sqlite | fs | memory
  #   - cos:    production multi-instance deployment (cross-node shared)
  #   - sqlite: single-instance local dev / CI; has a sweeper to auto-clear ttl buckets
  #   - fs:     offline / docker fallback; no sweeper
  #   - memory: fallback / testing; cleared on process restart
  # Production multi-node must use cos; sqlite/fs/memory are all process-local and
  # will always miss across nodes.
  backend: sqlite

  # ── TTL / NoTTL prefix bucketing (business code buckets by key prefix, see 2026-07-10 plan) ──
  # `ttl/`   — hot cache: inj-sess (session init state) / inj-hook (warm-up injection).
  #             Can be rebuilt if lost (binding fallback / re-run hook), business-transparent.
  # `nottl/` — business state: binding / sk-extract / skill-vpin. **Permanently kept**,
  #             no lifecycle rule configured; losing it forces users to redo the session_init form.
  #
  # Only the `ttl/` prefix is cleared (implementation differs per backend):
  #   - CosStorage:    ⚠️ ttlDays is **not read**! Configure a lifecycle rule in the COS console:
  #                    delete `proxy_cache/ttl/` prefix after N days unmodified. **nottl/ not configured**.
  #   - SqliteStorage: built-in sweeper clears the ttl bucket of the proxy_kv table every 5 min by ttlDays
  #   - FsStorage:     no sweeper (container FS mtime unreliable), delegated to external tmpwatch
  #   - MemoryStorage: cleared on process restart, this TTL does not apply
  #
  # [cos=dead / sqlite=opt default 7 / fs+memory=dead] `ttl/` prefix cleanup window (days).
  ttlDays: 7

  # ── COS backend (preferred for production multi-instance) ──────────────────
  # Before going live you must configure a lifecycle rule in the COS console:
  #   `proxy_cache/ttl/`   prefix unmodified for N days → delete
  #   `proxy_cache/nottl/` prefix → no rule → permanently kept
  #
  # Only kernel-sts mode is supported (static AK/SK is forbidden in production):
  # - each spaceId pulls an independent STS from Shark, with permissions strictly
  #   bound to `proxy_cache/ttl/{spaceId}/*` + `proxy_cache/nottl/{spaceId}/*`
  # - bucket / region are parsed from the CosUrl returned by Shark, no config needed
  # - when endpointDomain is unset, a 4-level priority auto-decides (see field
  #   comment); leaving it empty works fine
  # - when Shark is unavailable the COS backend assembly fails and the process
  #   will not degrade to start
  # See docs/design/2026-07-12-cos-shark-sts-credential-plan.md
  #
  # Key layout:
  #   proxy_cache/{ttl|nottl}/{spaceId}/{userId}/{agentSource}/{sessionId}/...
  # ttl/nottl must come before spaceId — lifecycle rules do not support mid-path wildcards.
  #
  # The whole section can be deleted when backend != cos.
  cos:
    # [dead] shark side hardcodes "proxy_cache"; the proxy layer never reads this field.
    # Kept only for backward-compatible yaml structure, will be removed in the future.
    # Deleting it does not affect runtime.
    rootPrefix: "proxy_cache/"

    # [opt] override the COS SDK endpoint domain. **Highest priority**.
    # When unset (empty / undefined), a 4-level priority auto-decides, aligned with core
    # `tdai-memory-openclaw-plugin/src/gateway/server.ts::initSharedCosClient`:
    #   1. this field non-empty                              → use it
    #   2. Shark CosUrl is already VPC internal (cloud vendor internal domain) → use it
    #   3. Shark CosUrl is public → auto-rewrite to VPC internal domain (by cred.region)
    #   4. none of the above apply (cred has no region)      → SDK default public
    # Production kernel-sts deployment (inside cloud vendor VPC) usually leaves this
    # empty — auto internal routing is cheaper and more stable.
    # Deployed outside the cloud vendor VPC you must explicitly set a public / custom
    # domain and ensure the bucket allows the corresponding network.
    # Supports the `{Bucket}` placeholder (custom CDN scenarios).
    endpointDomain: "" # e.g. `cos.example.com` (custom CDN or public mapping)

    # ── Shark temporary credential fetch ──
    # Requires the Shark-side endpoint `POST /meta/GetProxyCacheCosConfig` (see plan §3.1).
    shark:
      # [req] Shark management-plane base URL. Test environment address; production
      # is overridden by the deployer in config.yaml.
      baseUrl: "http://gateway.example.com:8000"

      # [opt] shark HTTP request timeout (ms). Default 10000.
      timeoutMs: 10000

      # [opt] retry count for 5xx / 429 / network error / timeout. Default 2.
      retryCount: 2

      # [opt] how many ms before STS expiry to refresh. Default 120000 (2 min).
      # Affects availability: too short → expired credentials on shark jitter; too long → needless frequent refresh.
      refreshBufferMs: 120000

      # [opt] per-spaceId backend pool cap (LRU). Default 100.
      # Affects capacity: exceeding the multi-tenant space count triggers LRU evict (delayed close of old backend).
      maxSpaces: 100

      # [opt] ms to delay closing an old backend on LRU evict (in-flight request protection). Default 30000.
      graceCloseDelayMs: 30000

  # ── SQLite backend (single-instance local dev / CI) ────────────────────────
  # The only backend where "changing yaml ttlDays takes effect immediately" —
  # the sweeper clears the ttl bucket of the proxy_kv table every 5 min by the
  # top-level ttlDays (nottl bucket is permanently kept).
  # The whole section can be deleted when backend != sqlite.
  sqlite:
    # [sqlite=opt default empty / others=dead] empty = PROXY_DB_PATH env or ~/.tdai-memory-proxy/proxy.db
    dbPath: ""

  # ── Local filesystem (offline / docker read-only fallback) ─────────────────
  # No sweeper (fs.stat().mtime is unreliable on container FS), delegated to external tmpwatch.
  # The whole section can be deleted when backend != fs.
  fs:
    # [fs=req / others=dead] root directory (must be writable)
    fsRoot: "/var/lib/context-proxy/storage"

# ── Opik LLM observability (Comet ML Opik) ───────────────────────────────────
# Request/response traces and spans are auto-reported to Opik.
opik:
  enabled: false # whether Opik reporting is enabled
  url: "http://127.0.0.1:5173" # Opik service address
  apiKey: "" # Opik API Key (if the Opik instance requires auth)
  # stripRequestLogContent: false  # true = forked request_log trace does not record message content (saves storage)

# ── Langfuse LLM observability (official SDK reporting) ──────────────────────
# One trace = one turn (one user input); tool-loop requests within the same turn
# are grouped into multiple generations under the same trace. Reported content
# includes: model/latency/token usage/cache hit/cost.
langfuse:
  enabled: false # whether Langfuse reporting is enabled
  host:
    "" # Langfuse instance base URL, e.g. http://localhost:3000
    #   OTLP mode: fill in the OTLP endpoint
  publicKey: "" # Langfuse public key (pk-lf-...); OTLP mode: fill in token
  secretKey: "" # Langfuse secret key (sk-lf-...); OTLP mode: leave empty

# ── ClickHouse usage reporting ───────────────────────────────────────────────
# Records each user's token consumption per turn, queryable by model / user / session.
# Table schema includes: timestamp / model_id / key_id(user) / session_key + turn_seq(turn) /
#           user_input / prompt_tokens / completion_tokens / total_tokens /
#           cache_hit_tokens / cache_write_tokens.
# 4xx/5xx failed requests are not written.
clickhouse:
  enabled: false # whether ClickHouse usage reporting is enabled
  url: "http://clickhouse.example.com:8123" # ClickHouse HTTP endpoint
  database: context_proxy # database name
  table: usage_logs # usage table name (TokenHub and other known formats)
  rawTable: usage_raw # raw usage trace table (non-TokenHub / unknown formats fall back here)
  user: default # ClickHouse username
  password: "" # ClickHouse password
  flushIntervalMs: 5000 # periodic flush interval (ms), default 5 seconds
  flushThreshold: 50 # flush immediately after N buffered records (0 = disable batch flush)
  ttlDays: 30 # data retention days (0 = no auto-expiry; applied at startup via CREATE TABLE TTL)

# ── Auth authentication (user_key verification → user_id resolution) ─────────
# When enabled, the proxy calls kernel POST /v3/meta/auth/verify to verify the client API Key.
# Any result that is not valid=true returns 401 and rejects the request (including timeout/network errors).
# x-tdai-service-id is auto-extracted from the request path /proxy/<spaceId>/...
# After verification, user_id is written to the ClickHouse key_id column and used
# as the full-chain user identifier.
auth:
  enabled: true # whether authentication is enabled
  url: "http://kernel.example.com:8420" # kernel auth service base URL (auto-appends /v3/meta/auth/verify)
  timeoutMs: 5000 # auth request timeout (ms)

# ── Admin / Ops endpoint auth (service-level shared secret) ─────────────────
# Scope: only ops endpoints like `/v3/instance/proxy-destroy` (clears proxy-side
# COS cache when shark destroys an instance). Completely independent from the
# tenant verifyUserKey in auth.* above — that is a tenant-dimension
# x-tdai-user-key check; this is a shared secret for ops/system services.
#
# Behavior (semantics aligned with core gateway's server.apiKey, see openclaw-plugin
# gateway/server.ts:1076-1089):
#   - apiKey empty (default)        = auth disabled, ops endpoint publicly accessible; no startup warning
#                                    (production relies on network isolation + apigw fallback,
#                                    same as core's current production `TDAI_GATEWAY_API_KEY` not enabled)
#   - apiKey non-empty              = request must carry `Authorization: Bearer <apiKey>`
#                                    constant-time comparison (crypto.timingSafeEqual)
#
# How to decide the value:
#   - a fixed string agreed by both sides (proxy side + shark side), unrelated to any specific instance
#   - usually generated by ops with `openssl rand -hex 32`, distributed to both the proxy's
#     `TDAI_PROXY_ADMIN_API_KEY` env and shark's client config
#   - not the admin user_key of any memory instance (that goes through `x-tdai-user-key`,
#     an in-instance user concept; the two are completely unrelated)
#
# Priority: env TDAI_PROXY_ADMIN_API_KEY > yaml admin.apiKey > default ""
admin:
  apiKey:
    "" # empty = ops endpoint public (equivalent to unset). In production prefer
    # injecting via env TDAI_PROXY_ADMIN_API_KEY to avoid committing to git

# ── System users (internal service accounts: matched → full-chain pass-through) ─
# Match flow: first use apiKey to call auth/verify to get user_id → user_id is in
# the systemUsers list below → matched, short-circuit pass-through. After matching,
# the proxy forwards the request as-is to config.upstream.url, skipping session
# init and context injection.
# Usage/credit is still recorded (keyId = userId, spaceId = memory instance id in path).
# Depends on auth.enabled=true — when auth is off, verify returns an empty user_id
# and the short-circuit never triggers.
# The userKey field is kept only as an ops reference (was once the match key, now
# only appears in logs/comments), can be omitted; userId is required. Array supports
# multiple entries; empty array disables this feature.
systemUsers:
  - name: memory # logical name, only for logs
    userId: "${TDAI_MEMORY_SYSTEM_USER_ID}" # match key & billing user_id (required)
    displayName: "${TDAI_MEMORY_SYSTEM_USER_NAME}"
    userKey: "${TDAI_MEMORY_SYSTEM_USER_KEY}" # historical sk-mem-xxx, ops reference only (optional)
  # - name: wiki
  #   userId: "${TDAI_WIKI_SYSTEM_USER_ID}"
  #   displayName: "${TDAI_WIKI_SYSTEM_USER_NAME}"
  #   userKey: "${TDAI_WIKI_SYSTEM_USER_KEY}"

# ── Credit reporting (TDAI MemoryPlus billing) ───────────────────────────────
# After each LLM response completes, computes this turn's CreditDelta from the
# creditPricing table and POSTs to the external billing service. Only TokenHub
# upstream performs pricing; non-TokenHub upstream has CreditDelta=0.
# Only requests carrying the /proxy/<spaceId>/ prefix trigger reporting; SpaceId is
# auto-extracted from the path.
# Streaming requests are best-effort: reporting failure only logs and does not interrupt the stream.
# Non-streaming request failures are recorded in the `x-credit-report-error` response header.
creditReport:
  url: "http://gateway.example.com:8000/UpdateMemoryPlusUsage"
  timeoutMs: 5000 # reporting timeout (ms), 0 = no timeout

# ── Credit pricing table ─────────────────────────────────────────────────────
# Unit: Credit / 1K Token.
# Model matching rule: usage.model → case-insensitive whole-word match → no match → credit=0
#   (falls back to usage_raw table and marks reason='unknown_model').
# Field description:
#   name          — model ID (used to match usage.model, case-insensitive whole-word match)
#   modelName     — display name (optional, for UI/reports; falls back to name when unset)
#   input         — standard input tokens (non-cached portion)
#   output        — output tokens
#   cacheRead     — cache hit read tokens (prompt_cache_hit_tokens / cache_read_input_tokens)
#   cacheWrite5m  — cache write 5-minute TTL (cache_creation.ephemeral_5m_input_tokens)
#   cacheWrite1h  — cache write 1-hour TTL (cache_creation_input_tokens non-ephemeral portion)
creditPricing:
  models:
    - name: "your-endpoint-id" # endpoint id / model alias issued by upstream, e.g. Claude Sonnet
      modelName: "Claude Sonnet"
      input: 5.4935
      output: 27.4673
      cacheRead: 0.5493
      cacheWrite5m: 6.8668
      cacheWrite1h: 10.9869

    - name: "deepseek-v4-pro" # DeepSeek V4 Pro
      modelName: "DeepSeek V4 Pro"
      input: 0.4500
      output: 0.9000
      cacheRead: 0.0038
      cacheWrite5m: 0.4500
      cacheWrite1h: 0.4500

    - name: "deepseek-v4-flash" # DeepSeek V4 Flash
      modelName: "DeepSeek V4 Flash"
      input: 0.1500
      output: 0.3000
      cacheRead: 0.0030
      cacheWrite5m: 0.1500
      cacheWrite1h: 0.1500

# ── Context injection (injection pipeline) ───────────────────────────────────
# Injects relevant knowledge/memory/skills into the system prompt of each LLM request.
# The injection pipeline runs after session init completes.
# Each injector is an independent Hook, executed in registration order.
#
# Available injectors:
#   skill       — <cloud_skills> block: retrieves relevant skills from kernel RAG and injects into system prompt;
#                 also injects a <skill_tools> block telling the LLM how to call skills via curl.
#                 Data source = the endpoint in the skill section (kernel gateway).
#   knowledge   — <knowledge_tools> block: fetches the team knowledge resource list from the kernel,
#                 injects a two-step self-discovery flow tool (depends on skill.serviceToken).
#   tdai-memory — TDAI L2/L3 memory injection (controlled by tdai.memory.*, see the tdai section).
injection:
  enabled: true # whether context injection is enabled (disabling invalidates the injectors list below)
  injectors: ["skill", "knowledge", "tdai-memory"] # list of injectors to enable
  # Unified external gateway address — the curl URLs embedded in the LLM-generated
  # <skill_tools> / <tdai_memory_tools> blocks use this as base. Only fill the
  # gateway domain, **without port** (the port the gateway routes to the proxy pod
  # is configured by ops on the gateway side, unrelated to this).
  #
  # ⚠️ Required for multi-node deployment. When unset, each pod falls back to its
  # own host:port → the same hook cache in COS is overwritten by pods → upstream
  # Anthropic KV cache misses every time (costly + slow).
  #
  # The gateway side must pass the following two prefixes through to the proxy pod as-is:
  #   /skill-bridge/**   → proxy /skill-bridge/**
  #   /memory-bridge/**  → proxy /memory-bridge/**
  externalGatewayUrl: "https://gateway.example.com"

  # ── Asset reflection mode (internal effect evaluation; disabled by default) ──
  # Structure fully aligned with costGuard.markerOptIn:
  #   markerOptIn=false (default): AssetReflectionInjector is not registered, zero performance overhead.
  #                                External user request prompts are completely unchanged.
  #   markerOptIn=true: AssetReflectionInjector is registered, but only requests whose URL carries
  #                    the `/analyse` marker (same structure as `/cost-guard`: placed after
  #                    `/{agent}/{spaceId}`, e.g.
  #                    `/codebuddy/default/analyse/v1/messages`) emit an
  #                    `<asset_reflection>` block at the end of the system prompt, guiding
  #                    the agent to comment on "which cloud asset tools were called this turn
  #                    and whether each was effective".
  # The tag list is decided by the asset injectors actually registered on this node
  # (skill / tdai-memory / knowledge); when none are enabled the injector never emits.
  assetReflection:
    markerOptIn: false

# ── Extraction (write side: flows each turn's conversation/tool calls back to the kernel) ──
# Dual of injection: injection decides "what to put into the prompt", extraction
# decides "what to write back to the kernel".
#
# extractors whitelist (not in the list = not written back):
#   skill        — calls /v3/skill/conversation/add at the end of each real-human turn, core archives by threshold
#                  (depends on skill.endpoint + skill.serviceToken)
#   tdai-memory  — writes user_query + assistant reply into L0 short-term memory each turn
#                  (depends on tdai.enabled + tdai.memory.writeL0)
#
# Default behavior (omit this section): enabled=true, extractors=["skill","tdai-memory"] — equivalent to history.
# To "inject only, no extraction": set extraction.enabled: false, a one-shot switch.
extraction:
  enabled: true
  extractors: ["skill", "tdai-memory"]

# ── Session initialization (session init) ────────────────────────────────────
# On the user's first conversation, intercepts the request and pops up an
# interactive form guiding selection of team → agent → task; after selection,
# fetches agent/task details from the kernel and injects them into the system prompt.
#
# Flow:
#   1. pop asset_confirm dialog: ask the user whether to associate team assets
#   2. select team (only pops up when there are multiple teams)
#   3. select agent (supports pagination)
#   4. select task (optional, supports pagination/skip)
#   5. register session → inject agent/task context into system prompt
#
# State storage: default Redis (redis.enabled=true); after enabling storage.enabled=true
# it uses ProxyStorage (COS/SQLite/FS). When neither is enabled it falls back to
# SQLite single-instance local storage.
# team/agent/task lists come from the kernel MetadataClient (reuses the skill section config).
# User identity is determined in one hop by auth/verify; failed auth / unrecognized
# user → directly bypass session init.
sessionInit:
  enabled: true # whether session init is enabled
  maxRetries: 3 # max retries on form parse failure, beyond which bypass (skip session init)
  # Historical note: there was once a keepInitArtifacts switch to strip fake form
  # conversations after session_init completed; it has been removed. Now **always
  # keeps** all of the user's real conversations (including session_init form
  # interactions), no deletion.
  # <session_context> injection switch: after session init completes, each turn's
  # request appends agent/task info to the system prompt as a <session_context>
  # block. The two switches below can silence each independently.
  # Both off = no <session_context> injection at all. Both default to true, behavior
  # consistent with history.
  # When off, each session only warns once (avoids spamming long sessions).
  injectAgentContext: true # false = do not inject the [Agent] block (id/name/description/prompt)
  injectTaskContext: true # false = do not inject the [Task] block (id/name/description/goal)
  # header auto-preselect: when the first request's headers already carry identity
  # fields, validate existence in the list; on hit, skip the corresponding selection step.
  headerAutoSelect:
    enabled: true # whether header preselect is enabled
    teamHeader: "x-team-id" # request header name carrying team_id
    agentHeader: "x-agent-id" # request header name carrying agent_id
    taskHeader: "x-task-id" # request header name carrying task_id (optional)
    onMismatch: "form" # when header value not found: form=fall back to interactive form (default) | bypass=skip session init

  # ── DEBUG: local dev/e2e short-circuit ─────────────────────────────────────
  # After enabling debugForceIdentity, sessions with agentSource=workbuddy and
  # agentSource=codebuddy are **directly** registered as a fixed triple, bypassing
  # all form/header matching logic; keep commented in production.
  # debugForceIdentity:
  #   team_id: team-xxxxxxxxxx
  #   agent_id: agt-xxxxxxxxxx
  #   task_id: task-xxxxxxxxxx
  # WorkBuddy client's auth/verify has no real-human identity → use the line below
  # to hard-bind userId to a real kernel user_id (paired with the x-tdai-user-key in
  # upstream.agents.workbuddy.apiKey using a key under the same user). Keep commented in production.
  # debugForceUserId: usr-xxxxxxxxxx
  # In debug mode, output detailed diagnostic logs (request tools schema, system prompt summary, etc.).
  # Local/E2E integration only; keep false or unset in production. Disabled by default.
  # debugVerboseLogging: false

# ── TDAI Memory Gateway (core / openclaw-plugin) ─────────────────────────────
# The proxy implements memory read/write by interacting with the co-located kernel
# gateway (listening on 8420).
# Four-level memory:
#   L0 — short-term conversation memory (last N turns auto-written)
#   L1 — session-level key info extraction (extracts reusable structured memory from conversation)
#   L2 — Agent Profile (agent's long-term persona/rules/knowledge)
#   L3 — Team/Global memory (cross-agent shared organizational knowledge)
#
# Injection behavior:
#   when inject=true, L2+L3 are injected into the system prompt as system-level context;
#   L0/L1 are not directly injected into the prompt (would break KV cache), instead
#   exposed as read-only tools for the LLM to query proactively.
tdai:
  enabled: true # whether TDAI Memory is enabled
  endpoint: "http://127.0.0.1:8420" # kernel gateway address (usually same as skill.endpoint)
  apiKey: "local" # Authorization: Bearer value (usually same as skill.serviceToken)
  serviceId: "default" # x-tdai-service-id header value
  memory:
    enabled: true # Memory submodule master switch
    inject: true # context injection master switch (false = all L0~L3 injection off)
    writeL0: true # whether to write L0 (short-term conversation memory)
    recallL1: true # whether to enable L1 recall (retrieve relevant memory from conversation)
    injectL2L3: true # whether to inject L2 (Agent Profile) + L3 (Team/Global memory) into system prompt
    l1Limit: 5 # max L1 recall entries
    l2Limit: 3 # max L2/L3 injection entries
    timeoutMs: 5000 # single kernel call timeout (ms)

# ── Skill / kernel gateway data plane ────────────────────────────────────────
# The proxy communicates with the kernel gateway via this config for three capabilities:
#   1. <cloud_skills> RAG injection: GET /v3/skill/search to retrieve relevant skills
#   2. Skill archive trigger: calls /v3/skill/conversation/add at the end of each real-human turn,
#      core archives and asynchronously extracts by tool_call ≥ 10 or bytes ≥ 40KB thresholds.
#   3. knowledge injector fetches the team knowledge resource list
# The same serviceToken is also injected by the /skill-bridge reverse proxy when
# forwarding LLM curl, avoiding the token appearing in the LLM-visible prompt.
# sessionInit's team/agent/task list is also fetched through this kernel (MetadataClient).
#
# Section name compatibility: can also be written as `coreSkill:` (old name, still read);
# when both exist, `skill:` takes priority.
skill:
  endpoint: "http://127.0.0.1:8420" # kernel gateway address (usually same as tdai.endpoint)
  serviceToken:
    "local" # auth credential → Authorization: Bearer <serviceToken>
    #   consistent with the kernel's service whitelist; use "local" for local dev
  serviceId:
    "context-proxy" # tenant/service identifier → x-tdai-service-id
    #   overridden by spaceId when the request path carries /proxy/<spaceId>/
  timeoutMs: 1500 # single call timeout (ms). RAG is on the session_init hot path, keep it small

# ── Knowledge tools injection (independent gateway config) ───────────────────
# The proxy accesses the kernel gateway via this config to fetch team knowledge
# resources (code-graph / wiki), renders a <knowledge_tools> block into the system
# prompt, and the LLM calls KS's tools/list|call accordingly.
#
# Independent from the skill section: endpoint can differ (e.g. skill uses kernel
# direct IP, knowledge uses an API Gateway domain).
#
# Disable: enabled=false (default), injector not registered, no injection.
knowledge:
  enabled: false # disabled by default, consistent with tdai.enabled behavior
  endpoint: "http://127.0.0.1:8420" # kernel gateway address
  serviceToken: "local" # Authorization: Bearer
  serviceId: "context-proxy" # x-tdai-service-id (overridden by request path spaceId)
  timeoutMs: 1500 # single call timeout (ms)

# ── Skill runtime ────────────────────────────────────────────────────────────
#
# skill extraction chain: at the end of each real-human turn (agent gives a final
# reply with no tool_use), the proxy synchronously calls POST /v3/skill/conversation/add,
# handing this turn's conversation slice to core. core maintains its own buffer and
# archives + triggers a background Worker to extract skills when tool_call ≥ 10 or
# bytes ≥ 40KB. The proxy needs no extra config.
#
# Historical config items (removed): extractToolCallThreshold / maxBucketCount /
# conversationAddEnabled — belonged to the proxy-side legacy SkillExtractTrigger chain, now retired.
skillRuntime:
  allowLlmWrite:
    false # whether the main model may create/modify skills (default false)
    #   false: <skill_tools> only injects read-only tools (search/list/view/files_read)
    #          /skill-bridge rejects write operations with 403
    #   true:  <skill_tools> injects all tools (including write ops create/update/delete etc.)
    #          /skill-bridge allows write operations

# ── mem: special commands ────────────────────────────────────────────────────
# When the user types mem:sync / mem:create-skill / mem:help etc. in the input box,
# the Proxy intercepts after session init, executes the corresponding operation and
# directly returns a fake LLM response, without injecting the system prompt (does not
# break KV cache) and without forwarding to the upstream model (zero token cost).
# L0 write / skill extract and other recording layers still run, keeping the
# conversation timeline continuous.
#
# When disabled, all mem:-prefixed messages are sent to the model normally, no interception.
memCommand:
  enabled: false # whether mem: command interception is enabled (default false, does not affect the original chain)
  allowedCommands: [] # command whitelist; empty array = all allowed
    # example: ["sync", "help"] — only these two commands allowed
    # valid values: sync | create-skill | help

# ── CC request routing ────────────────────────────────────────────────────────
# Identifies CC client (Claude Code CLI) background auxiliary requests and routes
# them through differentiated processing paths:
#   - main (main conversation/tool-loop):    full set (session-init + injection + L0 + skill + credit)
#   - fork (SUGGESTION/RECAP/…):  reuse MAIN cache — skip session-init form / mem interception /
#                                L0 / skill; injection runs readOnly (no self-heal cache); credit reported
#   - sidequery (TITLE/probe/…):  independent small request — skip session-init / mem interception / injection /
#                                L0 / skill; credit reported
#
# Classification signals (source hard constraints + packet-capture evidence):
#   1) cache_control marker at messages[n-2] → fork
#   2) cache_control marker at messages[n-1] or elsewhere → main
#   3) no marker + tools=[] + thinking.disabled → sidequery
#   4) otherwise → main (fallback when 3P provider disables caching)
#
# When disabled, all requests are treated as main, going through the fully equivalent legacy chain.
# See docs/design/2026-07-30-cc-request-routing-plan.md
ccRequestRouting:
  enabled: false # disabled by default. Before enabling, consider running an observation period of "classify but don't change path".


# ── Per-Agent upstream routing ───────────────────────────────────────────────
# See the `upstream.agents` section at the top of this file.
